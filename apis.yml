apis:
- name: TensorFlow Hub API
  description: >-
    TensorFlow Hub provides a repository of reusable trained machine learning models. The API allows developers
    to search, discover, and download pre-trained models and model components (SavedModels, TF.js models,
    TFLite models) that can be reused for transfer learning and inference in new applications.
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://tfhub.dev
  baseURL: https://tfhub.dev
  tags:
  - Models
  - Pre-Trained Models
  - Transfer Learning
  properties:
  - type: Documentation
    url: https://www.tensorflow.org/hub
- name: TensorFlow Model Analysis API
  description: >-
    TensorFlow Model Analysis (TFMA) provides tools and APIs for evaluating TensorFlow models. It enables
    computing metrics over large datasets using Apache Beam, slicing evaluation results across different
    features, and tracking model performance over time for validation and monitoring purposes.
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://www.tensorflow.org/tfx/model_analysis/get_started
  baseURL: https://localhost
  tags:
  - Analysis
  - Metrics
  - Model Evaluation
  properties:
  - type: Documentation
    url: https://www.tensorflow.org/tfx/model_analysis/get_started
