specification: API Commons Plans
specificationVersion: '0.1'
schema: https://raw.githubusercontent.com/api-evangelist/interface-research/main/schema/api-commons.yml#/$defs/Plans
provider: Google TensorFlow
providerId: google-tensorflow
created: '2026-05-04'
modified: '2026-05-05'
reconciled: true
tags:
  - AI
  - Deep Learning
  - Machine Learning
  - Model Serving
  - Open Source
description: TensorFlow is a free, open-source machine learning framework released under the Apache 2.0
  license. There are no commercial plans, paid tiers, or per-call charges from the TensorFlow project.
  TensorFlow Serving runs in the consumer's own infrastructure; TensorFlow Hub (Kaggle Models) and the
  TFMA tooling are likewise free to use. Costs that arise come from the underlying compute / storage the
  consumer provisions, not from TensorFlow itself.
sources:
  - https://www.tensorflow.org/
  - https://github.com/tensorflow/tensorflow
  - https://www.tensorflow.org/tfx/serving/api_rest
plans:
  - id: google-tensorflow-open-source
    name: Open Source
    type: freemium
    description: Apache 2.0 licensed framework. All TensorFlow APIs (Serving REST, Hub / Kaggle Models,
      Model Analysis) are free to use. The consumer pays only for self-managed infrastructure.
    entries:
      - label: Framework license
        name: license
        type: flat
        metric: license
        limit: -1
        timeFrame: usage
        geo: global
        unit: 1
        price: '0.00'
        userMultiplied: false
      - label: TensorFlow Serving inference (self-hosted)
        name: serving_inference
        type: flat
        metric: request
        limit: -1
        timeFrame: usage
        geo: global
        unit: 1
        price: '0.00'
        userMultiplied: false
      - label: TensorFlow Hub model downloads
        name: hub_downloads
        type: flat
        metric: download
        limit: -1
        timeFrame: usage
        geo: global
        unit: 1
        price: '0.00'
        userMultiplied: false
    elements:
      - name: Apache 2.0 license
      - name: TensorFlow Serving REST API
      - name: TensorFlow Hub / Kaggle Models
      - name: TensorFlow Model Analysis (TFMA)
      - name: Community support via GitHub / forum
      - name: No vendor charges
maintainers:
